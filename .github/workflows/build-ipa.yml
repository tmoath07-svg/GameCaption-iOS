name: Build and verify GameCaption IPA
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      neural:
        description: "Run the local INT8 developer smoke test instead of packaging the IPA"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-and-validate:
    if: github.event_name != 'workflow_dispatch' || !inputs.neural
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Validate independent project sources
        run: python3 scripts/validate_source.py
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen version
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build iPhone simulator (compile check)
        run: |
          set -euo pipefail
          xcodebuild -quiet -project GameCaption.xcodeproj -scheme GameCaption \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/simulator-build.log" 2>&1 || { cat "$RUNNER_TEMP/simulator-build.log"; exit 1; }
      - name: Build unsigned iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/GameCaptionBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build > "$RUNNER_TEMP/device-build.log" 2>&1 || { cat "$RUNNER_TEMP/device-build.log"; exit 1; }
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GameCaptionBuild/Build/Products/Release-iphoneos/GameCaption.app"
          test -f "$APP/Info.plist"
          EXT="$APP/PlugIns/GameCaptionBroadcast.appex"
          test -f "$EXT/Info.plist"
          test -f "$EXT/GameCaptionBroadcast"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.broadcast-services-upload'
          mkdir -p Payload
          ditto "$APP" Payload/GameCaption.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA="GameCaption-${VERSION}-unsigned.ipa"
          zip -q -r "$IPA" Payload
          python3 scripts/validate_source.py "$IPA"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameCaption-iPhone-unsigned-IPA
          path: GameCaption-*-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Run unit tests on available iPhone simulator
        timeout-minutes: 12
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for xs in d.values() for x in xs if "iPhone" in x["name"] and x["state"]=="Shutdown"]; print(ids[0] if ids else "")')
          test -n "$SIM_ID" || { echo "::error::No iPhone simulator runtime is available"; exit 1; }
          xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/GameCaptionTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/unit-tests.log" 2>&1 || { cat "$RUNNER_TEMP/unit-tests.log"; exit 1; }
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/GameCaptionTests.xcresult" \
            | tee "$RUNNER_TEMP/test-summary.json"
          python3 -c 'import json,sys; summary=json.load(open(sys.argv[1])); assert summary["passedTests"] > 0 and summary["failedTests"] == 0' "$RUNNER_TEMP/test-summary.json"
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameCaption-simulator-tests
          path: |
            ${{ runner.temp }}/GameCaptionTests.xcresult
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/test-summary.json
  test-neural-developer-build:
    if: github.event_name == 'workflow_dispatch' && inputs.neural
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned INT8 developer build
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          python3 scripts/fetch_neural_voice.py
          xcodegen generate --spec project-neural.yml
      - name: Run Swift inference and WAV decode on an iPhone simulator
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(x["udid"] for rows in json.load(sys.stdin)["devices"].values() for x in rows if "iPhone" in x["name"]))')
          xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
            -destination "platform=iOS Simulator,id=$SIM_ID" -only-testing:GameCaptionTests/NeuralVoiceTests \
            -resultBundlePath "$RUNNER_TEMP/NeuralVoice.xcresult" CODE_SIGNING_ALLOWED=NO test \
            > "$RUNNER_TEMP/neural-tests.log" 2>&1 || { cat "$RUNNER_TEMP/neural-tests.log"; exit 1; }
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/NeuralVoice.xcresult" \
            | tee "$RUNNER_TEMP/neural-summary.json"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["passedTests"] == 1 and s["failedTests"] == 0' "$RUNNER_TEMP/neural-summary.json"
