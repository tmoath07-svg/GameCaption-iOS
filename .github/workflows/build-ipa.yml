name: Build and verify GameCaption IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Validate independent project sources
        run: python3 scripts/validate_source.py
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen version
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build iPhone simulator (compile check)
        run: |
          set -euo pipefail
          xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/simulator-build.log" | tail -n 70
      - name: Run unit tests on available iPhone simulator
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for xs in d.values() for x in xs if "iPhone" in x["name"] and x["state"]=="Shutdown"]; print(ids[0] if ids else "")')
          if [ -z "$SIM_ID" ]; then
            echo "::warning::No iPhone simulator runtime available; simulator compilation already passed."
          else
            echo "Testing with simulator $SIM_ID"
            xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
              -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/unit-tests.log" | tail -n 90
          fi
      - name: Build unsigned iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project GameCaption.xcodeproj -scheme GameCaption \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/GameCaptionBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/device-build.log" | tail -n 90
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GameCaptionBuild/Build/Products/Release-iphoneos/GameCaption.app"
          test -f "$APP/Info.plist"
          mkdir -p Payload
          ditto "$APP" Payload/GameCaption.app
          zip -q -r GameCaption-0.2.0-unsigned.ipa Payload
          python3 scripts/validate_source.py GameCaption-0.2.0-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameCaption-iPhone-unsigned-IPA
          path: GameCaption-0.2.0-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
