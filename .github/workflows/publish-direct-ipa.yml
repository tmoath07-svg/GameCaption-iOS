name: Publish GameCaption direct IPA download
on:
  workflow_run:
    workflows: [Build and verify GameCaption IPA]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: gamecaption-release
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download and validate IPA from the successful main build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name GameCaption-iPhone-unsigned-IPA --dir dist
          shopt -s nullglob
          packages=(dist/GameCaption-*-unsigned.ipa)
          test "${#packages[@]}" -eq 1
          ipa="${packages[0]}"
          python3 scripts/validate_source.py "$ipa"
          name="${ipa##*/}"
          version="${name#GameCaption-}"
          version="${version%-unsigned.ipa}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (
            cd dist
            sha256sum "$name" > SHA256SUMS.txt
          )
          printf 'IPA=%s\nTAG=v%s\n' "$ipa" "$version" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          cat > release-notes.md <<EOF_NOTES
          Unsigned iPhone IPA from the [verified main build]($BUILD_URL).
          The app and ReplayKit extension need compatible signing and App Groups provisioning for device installation and capture.

          See the README for camera, ReplayKit, offline translation, neural speech, and browser subtitle setup. Console sessions and television hardware require separate testing.
          EOF_NOTES
          gh release create "$TAG" "$IPA" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" --title "GameCaption $TAG · unsigned iPhone IPA" --notes-file release-notes.md --latest
