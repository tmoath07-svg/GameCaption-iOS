name: GameCaption
options:
  bundleIdPrefix: com.tmoath07
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: 'NO'
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'NO'
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
targets:
  GameCaption:
    type: application
    platform: iOS
    sources:
      - path: GameCaption
        excludes: [GameCaption.entitlements, NeuralArabicVoice]
      - path: GameCaption/NeuralArabicVoice
        type: folder
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - target: GameCaptionBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gamecaption
        CODE_SIGN_ENTITLEMENTS: GameCaption/GameCaption.entitlements
        PRODUCT_NAME: GameCaption
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: 'GameCaption'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'اختر صورة من الألعاب لاستخراج النص وترجمته.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'تحتاج الكاميرا لقراءة النصوص الموجودة على شاشة اللعبة.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'يحتاج الميكروفون للتعرف على الكلام المسموع أثناء اللعب.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'التعرف على الكلام يحول كلام اللعبة المسموع إلى نص قابل للترجمة.'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'عرض الترجمة على متصفح جهاز آخر داخل شبكة Wi-Fi المحلية.'
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'
        MARKETING_VERSION: '0.4.0'
        CURRENT_PROJECT_VERSION: '4'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - GameCaptionTests
  GameCaptionBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: GameCaptionBroadcast
        excludes: [GameCaptionBroadcast.entitlements]
    info:
      path: GameCaptionBroadcast/Info.plist
      properties:
        CFBundleDisplayName: 'GameCaption Capture'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).SampleHandler'
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gamecaption.BroadcastExtension
        CODE_SIGN_ENTITLEMENTS: GameCaptionBroadcast/GameCaptionBroadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
  GameCaptionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GameCaptionTests
    dependencies:
      - target: GameCaption
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gamecaption.tests
        CODE_SIGN_STYLE: Manual
